# Habblaud Cloud: vários usuários com login, para rodar num servidor atrás de um proxy com HTTPS (Traefik do Velix).
#
#   docker compose -f docker-compose.cloud.yml up -d --build
#   docker compose -f docker-compose.cloud.yml logs habblaud   # mostra o código de instalação do primeiro acesso
#
# A porta 4747 (sem login: hooks e o navegador do próprio computador) NUNCA é publicada aqui. Só a 4748, que passa
# toda requisição pelo login (server/http/remote.ts + server/http/cloud.ts) e fala HTTP: o HTTPS fica com o proxy.
name: habblaud-cloud

services:
  habblaud:
    build: .
    image: habblaud:cloud
    container_name: habblaud-cloud
    restart: unless-stopped
    ports:
      # Por padrão só no loopback do host (teste local ou proxy na mesma máquina). Para o proxy alcançar por outra
      # interface, HABBLAUD_CLOUD_BIND no .env; nunca exponha esta porta direto na internet sem o HTTPS do proxy.
      - "${HABBLAUD_CLOUD_BIND:-127.0.0.1}:${HABBLAUD_CLOUD_PORT:-4748}:4748"
    volumes:
      - habblaud-cloud-data:/data
    environment:
      HABBLAUD_CLOUD: "1"
      # A 4747 (sem login) escuta só dentro do container: nem outro container da mesma rede a alcança.
      HABBLAUD_HOST: 127.0.0.1
      # A 4747 não é publicada (sem `ports:` para ela): o valor reflete isso para a trava do terminal.
      HABBLAUD_BIND: 127.0.0.1
      # O domínio do app (ex.: habblaud.needbr.com); localhost e IPs sempre valem.
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_LANG: ${HABBLAUD_LANG:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # A conta do Habblaud World só funciona pela porta local; no Cloud fica desligado.
      HABBLAUD_WORLD: "0"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  habblaud-cloud-data:
