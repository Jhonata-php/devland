# Imagem do Habblaud Cloud em ghcr.io/jhonata-php/habblaud, para a loja do Velix puxar.
#
# Sai a cada tag cloud-v* (ex.: cloud-v0.1.0 vira a imagem :cloud-v0.1.0), para amd64 e arm64. O manifesto do Velix
# (velix/apps/api/src/catalog/manifests/habblaud.ts) fixa a tag.
name: Imagem do Cloud

on:
  push:
    tags: ['cloud-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cloud
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jhonata-php/habblaud:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
